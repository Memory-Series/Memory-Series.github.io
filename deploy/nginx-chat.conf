# 网页端对话服务（C1 极薄代理）—— nginx 侧配置片段。
#
# 用法：把这两段 location 加进站点 server 块，然后
#   docker exec memory-series-nginx nginx -t && docker exec memory-series-nginx nginx -s reload
#
# 把 <GATEWAY> 换成**宿主机在 nginx 容器眼里**的地址（默认 bridge 通常是 172.17.0.1）：
#   docker exec memory-series-nginx sh -c "ip route | awk '/default{print $3}'"
#
# 为什么不把两个容器放进同一个 user-defined network 按容器名互访：
# 那需要重建 nginx 容器，而本内核（CentOS 7 / 3.10）上有过 EPERM 的前车之鉴
# —— "非必要不动"优先于"配置更干净"。详见 spec §3。

# 对话接口。用 `=` 精确匹配：只有这一条路径会被转发出去，
# 将来站点新增别的 /api/* 不会因为前缀匹配而被意外代理到服务端。
location = /api/chat {
    proxy_pass http://<GATEWAY>:8787;
    proxy_http_version 1.1;

    # 关键：**覆盖**写入而不是 append。
    #
    # `$proxy_add_x_forwarded_for` 会把客户端自己发来的 X-Forwarded-For 拼在前面，
    # 而服务端取的是最右段（最可信的那段）。两者配合的前提是这里只留真实地址；
    # 一旦改成 append，客户端就能靠伪造左侧内容把最右段挤掉，
    # **所有 IP 限额会直接失效**。见 spec §6「IP 取值」。
    #
    # 注意前提：本站 nginx 是直连入口。若将来前面加 CDN，
    # `$remote_addr` 会变成 CDN 的地址、所有访客共用一份限额 —— 那时需要改成
    # 该 CDN 的真实客户端头（如 `$http_cf_connecting_ip`），并同步复核服务端取值。
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;

    # 与 CHAT_MAX_BODY_BYTES(32 KB) 对齐。nginx 超限时会返回它自己的 HTML 413，
    # 前端按"非 JSON 响应"处理并降级 —— 与走服务端 413 的效果一致。
    client_max_body_size 32k;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    # 要比服务端的 CHAT_UPSTREAM_TIMEOUT_MS(20s) 宽松，否则 nginx 会先掐断，
    # 前端拿到的是网关超时而不是服务端的 502 —— 日志会两边对不上。
    proxy_read_timeout 25s;

    add_header Cache-Control "no-store" always;
}

# 健康检查。部署校验与容器干跑用它；不进访问日志（避免每 30 秒一条噪音）。
location = /api/health {
    proxy_pass http://<GATEWAY>:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
}
