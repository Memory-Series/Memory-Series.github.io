<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Trace/Inhabit · Promo</title>
    <style>
      @font-face {
        font-family: 'Manrope';
        font-style: normal;
        font-weight: 400;
        src: url('fonts/manrope-400.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Manrope';
        font-style: normal;
        font-weight: 600;
        src: url('fonts/manrope-600.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Noto Sans SC';
        font-style: normal;
        font-weight: 400;
        src: url('fonts/notosanssc-400.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Noto Sans SC';
        font-style: normal;
        font-weight: 600;
        src: url('fonts/notosanssc-600.ttf') format('truetype');
      }
      html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0d1326; }
      .scene {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        box-sizing: border-box;
        opacity: 0; /* every scene starts invisible; its fromTo() crossfade reveals it */
      }
      .grain {
        position: absolute;
        inset: 0;
        opacity: 0.06;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        background-repeat: repeat;
        background-size: 200px 200px;
        pointer-events: none;
      }
      .eyebrow {
        font-family: Manrope, "Noto Sans SC", sans-serif;
        font-size: 18px;
        letter-spacing: 0.34em;
        color: #d9a441;
        text-transform: uppercase;
      }
      .section-title {
        font-family: Manrope, "Noto Sans SC", sans-serif;
        font-weight: 600;
        font-size: 56px;
        letter-spacing: -0.02em;
        color: #e8ecf5;
        text-align: center;
        text-wrap: balance;
        max-width: 70%;
      }
      .bullets {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .bullets li {
        font-family: Manrope, "Noto Sans SC", sans-serif;
        font-size: 28px;
        line-height: 1.7;
        color: #e8ecf5;
        text-align: center;
      }
      .closing {
        font-family: Manrope, "Noto Sans SC", sans-serif;
        font-weight: 600;
        font-size: 44px;
        line-height: 1.6;
        color: #e8ecf5;
        text-align: center;
        text-wrap: balance;
        max-width: 60%;
        padding: 0 120px;
        box-sizing: border-box;
      }
      .gold-line {
        width: 0;
        height: 2px;
        background: #d9a441;
      }
      .brand {
        font-family: Manrope, "Noto Sans SC", sans-serif;
        font-size: 30px;
        letter-spacing: 0.2em;
        color: #d9a441;
      }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="trace-promo" data-start="0" data-duration="15.3" data-width="1920" data-height="1080">
      <section class="scene" id="scene-1">
        <div class="grain"></div>
        <p id="s1-eyebrow" class="clip eyebrow" data-start="0.6" data-duration="4.9">寻迹 TRACE</p>
        <h2 id="s1-title" class="clip section-title" data-start="1.1" data-duration="4.4">从素材中提取角色人格</h2>
        <ul id="s1-bullets" class="clip bullets" data-start="1.9" data-duration="3.6">
          <li>从小说、剧本、动漫素材提取角色人格</li>
          <li>分析语言风格、性格特征、行为模式</li>
          <li>输出 SoulPod（profile.json / system_prompts.txt / memories）</li>
        </ul>
      </section>
      <section class="scene" id="scene-2">
        <div class="grain"></div>
        <p id="s2-eyebrow" class="clip eyebrow" data-start="6.3" data-duration="4.7">入心 INHABIT</p>
        <h2 id="s2-title" class="clip section-title" data-start="6.8" data-duration="4.2">以角色身份，持续存在</h2>
        <ul id="s2-bullets" class="clip bullets" data-start="7.5" data-duration="3.5">
          <li>加载 SoulPod，以角色身份对话</li>
          <li>模式：复刻模式 / 伴侣模式</li>
          <li>能力：角色场景对话，角色图像生成，角色语音生成</li>
        </ul>
      </section>
      <section class="scene" id="scene-3">
        <div class="grain"></div>
        <p id="s3-closing" class="clip closing" data-start="11.7" data-duration="3.6">
          让行为逻辑与角色能力，以更持续的数字生命形式继续存在。
        </p>
        <div id="s3-line" class="clip gold-line" data-start="12.8" data-duration="2.5"></div>
        <p id="s3-brand" class="clip brand" data-start="13.4" data-duration="1.9">
          Memory · Trace / Inhabit
        </p>
      </section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Scene 1 — 寻迹 Trace entrance (0s)
      tl.from("#scene-1", { opacity: 0, duration: 0.7, ease: "sine.out" }, 0);
      tl.from("#scene-1 .eyebrow", { opacity: 0, y: 20, duration: 0.4, ease: "power2.out" }, 0.6);
      tl.from("#scene-1 .section-title", { opacity: 0, y: 24, duration: 0.5, ease: "power3.out" }, 1.1);
      tl.from("#scene-1 .bullets li", { opacity: 0, y: 16, stagger: 0.16, duration: 0.45, ease: "power2.out" }, 1.9);

      // Scene 1 → 2 crossfade (5.6s, 0.8s)
      tl.fromTo("#scene-2", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 5.6);
      tl.to("#scene-1", { opacity: 0, duration: 0.8, ease: "sine.inOut" }, 5.6);
      tl.set("#scene-1", { opacity: 0 }, 6.4);
      // Scene 2 — 入心 Inhabit elements enter
      tl.from("#scene-2 .eyebrow", { opacity: 0, y: 18, duration: 0.35, ease: "power2.out" }, 6.3);
      tl.from("#scene-2 .section-title", { opacity: 0, y: 22, duration: 0.45, ease: "power3.out" }, 6.8);
      tl.from("#scene-2 .bullets li", { opacity: 0, y: 14, stagger: 0.14, duration: 0.4, ease: "power2.out" }, 7.5);

      // Scene 2 → 3 crossfade (11.0s, 0.8s)
      tl.fromTo("#scene-3", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 11.0);
      tl.to("#scene-2", { opacity: 0, duration: 0.8, ease: "sine.inOut" }, 11.0);
      tl.set("#scene-2", { opacity: 0 }, 11.8);
      // Scene 3 — 收束 elements enter
      tl.from("#scene-3 .closing", { opacity: 0, y: 24, duration: 0.6, ease: "power3.out" }, 11.7);
      tl.fromTo("#scene-3 .gold-line", { width: 0 }, { width: 240, duration: 0.6, ease: "power2.out" }, 12.8);
      tl.from("#scene-3 .brand", { opacity: 0, y: 12, duration: 0.4, ease: "power2.out" }, 13.4);
      // Final scene: fade to black (14.5s, ends at 15.3s)
      tl.to("#scene-3", { opacity: 0, duration: 0.8, ease: "sine.in" }, 14.5);

      window.__timelines["trace-promo"] = tl;
    </script>
  </body>
</html>
