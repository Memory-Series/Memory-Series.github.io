<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Trace/Inhabit · Promo</title>
    <style>
      html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0d1326; }
      .scene {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        box-sizing: border-box;
        opacity: 0; /* every scene starts invisible; its fromTo() crossfade reveals it */
      }
      .hero-title {
        font-family: Manrope, "Noto Sans SC", sans-serif;
        font-weight: 600;
        font-size: 84px;
        letter-spacing: -0.02em;
        color: #e8ecf5;
        text-align: center;
        text-wrap: balance;
        max-width: 70%;
        padding: 0 120px;
        box-sizing: border-box;
      }
      .glow-dots {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 30% 40%, rgba(217, 164, 65, 0.14), transparent 35%),
                    radial-gradient(circle at 70% 60%, rgba(217, 164, 65, 0.10), transparent 40%);
        filter: blur(8px);
      }
      .grain {
        position: absolute;
        inset: 0;
        opacity: 0.06;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        background-repeat: repeat;
        background-size: 200px 200px;
        pointer-events: none;
      }
      .eyebrow {
        font-family: Manrope, "Noto Sans SC", sans-serif;
        font-size: 18px;
        letter-spacing: 0.34em;
        color: #d9a441;
        text-transform: uppercase;
      }
      .section-title {
        font-family: Manrope, "Noto Sans SC", sans-serif;
        font-weight: 600;
        font-size: 56px;
        letter-spacing: -0.02em;
        color: #e8ecf5;
        text-align: center;
        text-wrap: balance;
        max-width: 70%;
      }
      .bullets {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .bullets li {
        font-family: Manrope, "Noto Sans SC", sans-serif;
        font-size: 28px;
        line-height: 1.7;
        color: #e8ecf5;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="trace-promo" data-start="0" data-duration="45" data-width="1920" data-height="1080">
      <section class="scene" id="scene-1">
        <div class="grain"></div>
        <div class="glow-dots" aria-hidden="true"></div>
        <h1 id="hero-title" class="clip hero-title" data-start="0.5" data-duration="7">
          让存在，不止停留在记忆里。
        </h1>
      </section>
      <section class="scene" id="scene-2">
        <div class="grain"></div>
        <p id="s2-eyebrow" class="clip eyebrow" data-start="8.5" data-duration="11">寻迹 TRACE</p>
        <h2 id="s2-title" class="clip section-title" data-start="9.0" data-duration="10.5">从素材中提取角色人格</h2>
        <ul id="s2-bullets" class="clip bullets" data-start="10.5" data-duration="9">
          <li>从小说、剧本、动漫素材提取角色人格</li>
          <li>分析语言风格、性格特征、行为模式</li>
          <li>输出 SoulPod（profile.json / system_prompts.txt / memories）</li>
        </ul>
      </section>
      <section class="scene" id="scene-3">
        <div class="grain"></div>
        <p id="s3-eyebrow" class="clip eyebrow" data-start="20.5" data-duration="13">入心 INHABIT</p>
        <h2 id="s3-title" class="clip section-title" data-start="21.0" data-duration="12.5">以角色身份，持续存在</h2>
        <ul id="s3-bullets" class="clip bullets" data-start="22.0" data-duration="11.5">
          <li>加载 SoulPod，以角色身份对话</li>
          <li>模式：复刻模式 / 伴侣模式</li>
          <li>能力：角色场景对话，角色图像生成，角色语音生成</li>
        </ul>
      </section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Scene 1 entrance — deep space glow + hero title
      tl.from("#scene-1", { opacity: 0, duration: 2.5, ease: "sine.out" }, 0);
      tl.from("#scene-1 .glow-dots", { opacity: 0, duration: 2, ease: "sine.out" }, 0);
      tl.from("#scene-1 .hero-title", { opacity: 0, y: 30, duration: 0.75, ease: "power3.out" }, 1.2);

      // Scene 1 → 2 crossfade (8.0s, 1.2s)
      tl.fromTo("#scene-2", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "sine.inOut" }, 8.0);
      tl.to("#scene-1", { opacity: 0, duration: 1.2, ease: "sine.inOut" }, 8.0);
      // Scene 2 elements enter (staggered)
      tl.from("#scene-2 .eyebrow", { opacity: 0, y: 20, duration: 0.5, ease: "power2.out" }, 8.6);
      tl.from("#scene-2 .section-title", { opacity: 0, y: 24, duration: 0.6, ease: "power3.out" }, 9.1);
      tl.from("#scene-2 .bullets li", { opacity: 0, y: 16, stagger: 0.18, duration: 0.5, ease: "power2.out" }, 10.6);

      // Scene 2 → 3 crossfade (20.0s, 1.0s)
      tl.fromTo("#scene-3", { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "sine.inOut" }, 20.0);
      tl.to("#scene-2", { opacity: 0, duration: 1.0, ease: "sine.inOut" }, 20.0);
      tl.set("#scene-2", { opacity: 0 }, 21.0);
      // Scene 3 elements enter (slightly faster rhythm)
      tl.from("#scene-3 .eyebrow", { opacity: 0, y: 18, duration: 0.4, ease: "power2.out" }, 20.6);
      tl.from("#scene-3 .section-title", { opacity: 0, y: 22, duration: 0.5, ease: "power3.out" }, 21.1);
      tl.from("#scene-3 .bullets li", { opacity: 0, y: 14, stagger: 0.15, duration: 0.4, ease: "power2.out" }, 22.1);

      window.__timelines["trace-promo"] = tl;
    </script>
  </body>
</html>
